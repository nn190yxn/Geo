name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Prepare Node dependencies and builds
        shell: pwsh
        env:
          DATABASE_URL: postgresql://geo:geo@localhost:5432/geo_platform?schema=public
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $logFile = Join-Path $env:GITHUB_WORKSPACE 'release\node-build.log'
          function Invoke-LoggedCommand {
            param(
              [string]$Label,
              [scriptblock]$Command
            )
            Write-Output "::group::$Label"
            & $Command *>&1 | Tee-Object -FilePath $logFile -Append
            $exitCode = $LASTEXITCODE
            Write-Output '::endgroup::'
            if ($exitCode -ne 0) { throw "$Label failed with exit code $exitCode." }
          }
           # The installer embeds Electron, which is a root devDependency.
           Invoke-LoggedCommand 'Install Node dependencies' { npm ci --include=dev }
          Invoke-LoggedCommand 'Download Electron runtime' { node ./node_modules/electron/install.js }
          if (-not (Test-Path 'node_modules\electron\dist\electron.exe')) {
            throw 'Electron runtime download did not produce electron.exe.'
          }
          Invoke-LoggedCommand 'Generate Prisma Client' { npm run prisma:generate --workspace @geo-platform/api }
          Invoke-LoggedCommand 'Build shared types' { npm run build --workspace @geo-platform/shared-types }
          Invoke-LoggedCommand 'Build API' { npm run build --workspace @geo-platform/api }
          Invoke-LoggedCommand 'Build Web' { npm run build --workspace @geo-platform/web }
          Invoke-LoggedCommand 'Run desktop tests' { npm run desktop:test }
          $requiredOutputs = @(
            'packages\shared-types\dist',
            'apps\api\dist',
            'apps\web\dist'
          )
          foreach ($output in $requiredOutputs) {
            if (-not (Test-Path $output)) { throw "Required build output is missing: $output" }
          }
      - name: Upload Node build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-node-build-log
          path: release/node-build.log
          if-no-files-found: warn
      - name: Assemble desktop payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logFile = Join-Path $env:GITHUB_WORKSPACE 'release\assembly.log'
          & pwsh -NoProfile -File ./deploy/windows/prepare-payload.ps1 -Workspace $env:GITHUB_WORKSPACE -RuntimeDirectory $env:RUNNER_TEMP *>&1 | Tee-Object -FilePath $logFile
          $assemblyExitCode = $LASTEXITCODE
          if ($assemblyExitCode -ne 0) {
            $details = (Get-Content $logFile -Tail 30) -join ' | '
            Write-Output "::error title=Desktop payload assembly failed::$details"
            exit $assemblyExitCode
          }
      - name: Upload assembly log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-payload-assembly-log
          path: release/assembly.log
          if-no-files-found: warn
      - name: Validate Windows payload and scripts
        shell: pwsh
        run: |
          $scriptFiles = @(
            './deploy/windows/prepare-payload.ps1',
            './deploy/windows/validate-payload.ps1',
            './deploy/windows/Start-GEO.ps1',
            './deploy/windows/Stop-GEO.ps1'
          )
          foreach ($scriptFile in $scriptFiles) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptFile), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax validation failed: $scriptFile" }
          }
          & pwsh -NoProfile -File ./deploy/windows/validate-payload.ps1 -PayloadRoot "$env:GITHUB_WORKSPACE\release\payload"
      - name: Install Windows packager
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build EXE
        shell: pwsh
        env:
          GEO_RELEASE_VERSION: ${{ github.ref_name }}
          GEO_RELEASE_STAGE: ${{ github.workspace }}\release
        run: |
          $innoSetup = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $innoSetup deploy/windows/GEO.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed.' }
      - name: Verify installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem release/output/*.exe
          if ($installers.Count -ne 1) { throw 'Expected one EXE installer.' }
          if ($installers[0].Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
      - name: Verify Windows install, startup, upgrade, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem release/output/*.exe).FullName
          $installRoot = Join-Path $env:ProgramFiles 'AI品牌曝光助手'
          $dataRoot = Join-Path $env:LOCALAPPDATA 'AI-Brand-Visibility-Assistant\data'
          $stateFile = Join-Path $dataRoot 'runtime-state.json'
          $sentinel = Join-Path $dataRoot 'release-e2e.txt'
          $installerLog = Join-Path $env:GITHUB_WORKSPACE 'release\installer.log'
          trap {
            Write-Output "Desktop E2E failure: $($_.Exception.Message)"
            if (Test-Path $installerLog) {
              Write-Output "--- $installerLog ---"
              Get-Content $installerLog -Raw
            }
            if (Test-Path $installRoot) {
              Write-Output "--- installed files ---"
              Get-ChildItem $installRoot -Recurse | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String | Write-Output
            }
            foreach ($diagnosticFile in @($stateFile, (Join-Path $dataRoot 'logs\desktop.log'))) {
              if (Test-Path $diagnosticFile) {
                Write-Output "--- $diagnosticFile ---"
                Get-Content $diagnosticFile -Raw
              }
            }
            exit 1
          }

          function Wait-ForReady {
            $deadline = (Get-Date).AddMinutes(2)
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $stateFile) {
                $state = Get-Content $stateFile -Raw | ConvertFrom-Json
                if ($state.status -eq 'failed') {
                  throw "Desktop application startup failed: $($state.error)"
                }
                if ($state.status -eq 'running' -and $state.apiProcessId -and $state.databasePort) {
                  try {
                    $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$($state.apiPort)/api/v1/health/ready" -TimeoutSec 5
                    if ($response.StatusCode -eq 200) { return }
                  } catch {}
                }
              }
              Start-Sleep -Seconds 1
            }
            throw 'Desktop application did not reach the readiness endpoint within two minutes.'
          }

          $installerArguments = @(
            "/DIR=`"$installRoot`"",
            "/LOG=$installerLog",
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/NOCANCEL',
            '/CLOSEAPPLICATIONS'
          )
          $installProcess = Start-Process -FilePath $installer -ArgumentList $installerArguments -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Initial installer failed with exit code $($installProcess.ExitCode)" }
          & (Join-Path $installRoot 'windows\Start-GEO.ps1')
          Wait-ForReady
          New-Item -ItemType File -Path $sentinel -Force | Out-Null
          & (Join-Path $installRoot 'windows\Stop-GEO.ps1')

          $upgradeProcess = Start-Process -FilePath $installer -ArgumentList $installerArguments -Wait -PassThru
          if ($upgradeProcess.ExitCode -ne 0) { throw "Upgrade installer failed with exit code $($upgradeProcess.ExitCode)" }
          if (-not (Test-Path $sentinel)) { throw 'Upgrade removed persisted user data.' }
          & (Join-Path $installRoot 'windows\Start-GEO.ps1')
          Wait-ForReady
          & (Join-Path $installRoot 'windows\Stop-GEO.ps1')

          & (Join-Path $installRoot 'unins000.exe') /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $sentinel)) { throw 'Uninstall removed persisted user data.' }
          if (Test-Path $installRoot) { throw 'Uninstall left the application installation directory behind.' }
      - name: Collect Windows E2E diagnostics
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:LOCALAPPDATA 'AI-Brand-Visibility-Assistant\data'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'release\e2e-diagnostics'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          if (Test-Path $source) {
            Copy-Item $source $destination -Recurse -Force
          }
          $installerLog = Join-Path $env:GITHUB_WORKSPACE 'release\installer.log'
          if (Test-Path $installerLog) {
            Copy-Item $installerLog (Join-Path $destination 'installer.log') -Force
          }
          $installRoot = Join-Path $env:ProgramFiles 'AI品牌曝光助手'
          if (Test-Path $installRoot) {
            Get-ChildItem $installRoot -Recurse | Select-Object FullName, Length, LastWriteTime |
              ConvertTo-Json -Depth 2 |
              Set-Content (Join-Path $destination 'installed-files.json') -Encoding utf8
          }
      - name: Upload Windows E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-diagnostics
          path: release/e2e-diagnostics
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI品牌曝光助手 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            AI品牌曝光助手 Windows 独立桌面应用包含 API、Web、Electron 和 PostgreSQL 本地运行时。
            安装后从开始菜单或桌面快捷方式打开应用，无需 Docker Desktop。
            用户数据和日志位于 `%LOCALAPPDATA%\AI-Brand-Visibility-Assistant\data`。
            当前安装包未进行 Windows 代码签名。
          files: release/output/*.exe
