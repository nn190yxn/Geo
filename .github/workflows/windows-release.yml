name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Node dependencies and builds
        shell: pwsh
        run: |
          npm ci
          npm run prisma:generate
          npm run build
          npm run desktop:test
      - name: Create desktop payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:GITHUB_WORKSPACE 'release\payload'
          $app = Join-Path $payload 'app'
          New-Item -ItemType Directory -Force -Path $app, (Join-Path $app 'apps\api'), (Join-Path $app 'apps\web'), (Join-Path $app 'packages\shared-types'), (Join-Path $payload 'runtime\electron'), (Join-Path $payload 'runtime\postgres'), (Join-Path $payload 'windows'), (Join-Path $env:GITHUB_WORKSPACE 'release\output')
          Copy-Item package.json, package-lock.json -Destination $app
          Copy-Item apps\api\package.json -Destination (Join-Path $app 'apps\api')
          Copy-Item apps\web\package.json -Destination (Join-Path $app 'apps\web')
          Copy-Item packages\shared-types\package.json -Destination (Join-Path $app 'packages\shared-types')
          Copy-Item apps\api\prisma -Destination (Join-Path $app 'apps\api') -Recurse
      - name: Install desktop payload dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:GITHUB_WORKSPACE 'release\payload\app'
          $npmLog = Join-Path $env:RUNNER_TEMP 'desktop-payload-npm.log'
          Push-Location $app
          npm ci --ignore-scripts *>&1 | Tee-Object -FilePath $npmLog
          $npmExitCode = $LASTEXITCODE
          Pop-Location
          if ($npmExitCode -ne 0) {
            $details = (Get-Content $npmLog -Tail 20) -join ' | '
            Write-Output "::error title=Desktop payload dependency installation failed::$details"
            exit $npmExitCode
          }
      - name: Copy desktop application files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:GITHUB_WORKSPACE 'release\payload'
          $app = Join-Path $payload 'app'
          Copy-Item desktop -Destination $app -Recurse
          Copy-Item apps\api\dist -Destination (Join-Path $app 'apps\api') -Recurse
          Copy-Item apps\web\dist -Destination (Join-Path $app 'apps\web') -Recurse
          Copy-Item packages\shared-types\dist -Destination (Join-Path $app 'packages\shared-types') -Recurse
          Copy-Item node_modules\@prisma\client\* -Destination (Join-Path $app 'node_modules\@prisma\client') -Recurse -Force
          Copy-Item node_modules\.prisma\client -Destination (Join-Path $app 'node_modules\.prisma') -Recurse -Force
          Copy-Item node_modules\electron\dist\* -Destination (Join-Path $payload 'runtime\electron') -Recurse
          Copy-Item deploy\windows\Start-GEO.ps1, deploy\windows\Stop-GEO.ps1 -Destination (Join-Path $payload 'windows')
      - name: Download PostgreSQL runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $postgresZip = Join-Path $env:RUNNER_TEMP 'postgresql.zip'
          $postgresExtract = Join-Path $env:RUNNER_TEMP 'postgresql'
          Invoke-WebRequest -Uri 'https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64-binaries.zip' -OutFile $postgresZip
          Expand-Archive -Path $postgresZip -DestinationPath $postgresExtract -Force
          $postgresRoot = Get-ChildItem $postgresExtract -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'bin\initdb.exe') } | Select-Object -First 1
          if (-not $postgresRoot) { throw 'PostgreSQL archive does not contain initdb.exe.' }
          Copy-Item (Join-Path $postgresRoot.FullName '*') -Destination (Join-Path $env:GITHUB_WORKSPACE 'release\payload\runtime\postgres') -Recurse
      - name: Install Windows packager
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build EXE
        shell: pwsh
        env:
          GEO_RELEASE_VERSION: ${{ github.ref_name }}
          GEO_RELEASE_STAGE: ${{ github.workspace }}\release
        run: |
          $innoSetup = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $innoSetup deploy/windows/GEO.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed.' }
      - name: Verify installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem release/output/*.exe
          if ($installers.Count -ne 1) { throw 'Expected one EXE installer.' }
          if ($installers[0].Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI品牌曝光助手 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            AI品牌曝光助手 Windows 独立桌面应用包含 API、Web、Electron 和 PostgreSQL 本地运行时。
            安装后从开始菜单或桌面快捷方式打开应用，无需 Docker Desktop。
            用户数据和日志位于 `%LOCALAPPDATA%\AI-Brand-Visibility-Assistant\data`。
            当前安装包未进行 Windows 代码签名。
          files: release/output/*.exe
