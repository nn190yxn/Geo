name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Node dependencies and builds
        shell: pwsh
        run: |
          npm ci
          npm run prisma:generate
          npm run build --workspace @geo-platform/shared-types
          npm run build --workspace @geo-platform/api
          npm run build --workspace @geo-platform/web
          npm run desktop:test
          $requiredOutputs = @(
            'packages\shared-types\dist',
            'apps\api\dist',
            'apps\web\dist'
          )
          foreach ($output in $requiredOutputs) {
            if (-not (Test-Path $output)) { throw "Required build output is missing: $output" }
          }
      - name: Assemble desktop payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logFile = Join-Path $env:GITHUB_WORKSPACE 'release\assembly.log'
          & pwsh -NoProfile -File ./deploy/windows/prepare-payload.ps1 -Workspace $env:GITHUB_WORKSPACE -RuntimeDirectory $env:RUNNER_TEMP *>&1 | Tee-Object -FilePath $logFile
          $assemblyExitCode = $LASTEXITCODE
          if ($assemblyExitCode -ne 0) {
            $details = (Get-Content $logFile -Tail 30) -join ' | '
            Write-Output "::error title=Desktop payload assembly failed::$details"
            exit $assemblyExitCode
          }
      - name: Upload assembly log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-payload-assembly-log
          path: release/assembly.log
          if-no-files-found: warn
      - name: Install Windows packager
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build EXE
        shell: pwsh
        env:
          GEO_RELEASE_VERSION: ${{ github.ref_name }}
          GEO_RELEASE_STAGE: ${{ github.workspace }}\release
        run: |
          $innoSetup = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $innoSetup deploy/windows/GEO.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed.' }
      - name: Verify installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem release/output/*.exe
          if ($installers.Count -ne 1) { throw 'Expected one EXE installer.' }
          if ($installers[0].Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI品牌曝光助手 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            AI品牌曝光助手 Windows 独立桌面应用包含 API、Web、Electron 和 PostgreSQL 本地运行时。
            安装后从开始菜单或桌面快捷方式打开应用，无需 Docker Desktop。
            用户数据和日志位于 `%LOCALAPPDATA%\AI-Brand-Visibility-Assistant\data`。
            当前安装包未进行 Windows 代码签名。
          files: release/output/*.exe
